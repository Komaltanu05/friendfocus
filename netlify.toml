[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions."generate-plan"]
  timeout = 26

# Proxy /api/ requests to Netlify Functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Client-side routing fallback (SPA history API)
# Netlify Functions (/.netlify/functions/*) and static assets are served directly before this rule
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
